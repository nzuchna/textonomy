# Configuration for OSS experiment on Wiki dataset
experiment_name: "ICNLSP Experiment: Alignment 1"
mlflow_online: False
dataset_name: "wikitext-103-hoyle-2022"
text_column: "text"
gold_label: "supercategory"
train_data_sampling_seed: 42
taxonomy_train_data_size: 500
clf_train_data_size: 1340
classifier_split_ratio: 0.75
random_state_train_test_split: 580
loops: 1
train_tag_text: "wiki - from script"
evaluation_model: "mistral/mistral-large-2411"

model_params:
  use_case: "A taxonomy to organise these articles into main categories. Aim at around 10-20 categories. Examples: 'Music', 'Social sciences and society'..."
  data_description: "Each data point is an article from a sample of thousands of articles."
  temperature: 0.1
  max_completion_tokens: null
  retries: 15
  wait_time: 2
  summaries_max_thread_workers: 1
  cluster_name_length: 4
  cluster_description_length: 20
  max_num_clusters: 25
  summary_length: 50
  summary_explanation_length: 20
  taxonomy_explanation_length: 50
  classification_explanation_length: 20
  taxonomy_update_suggestion_length: 150
  taxonomy_refinement_iterations: 4
  summary_model: "mistral/mistral-large-2411"
  taxonomy_generation_model: "mistral/mistral-large-2411"
  synthesis_mode: False
  llm_classification_model: "mistral/mistral-large-2411"
  encoder_model_name: "all-MiniLM-L6-v2"
  classifier_train_test_split_ratio: 0.75
  shuffle_training_data: True
  shuffle_taxonomy_data: True
  shuffle_classifer_data: True
  shuffle_random_state: null
  verbose: True
  debug: False
