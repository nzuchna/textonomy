[project]
name = "textonomy"
version = "0.1.0"
description = "Repository for reproducing the results of the paper 'Textonomy: A TnT-LLM-Based Approach for Interpretable Topic Modeling at Scale'"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-identity>=1.24.0",
    "azure-storage-blob>=12.26.0",
    "bertopic>=0.17.3",
    "dotenv>=0.9.9",
    "gensim>=4.3.3",
    "instructor[litellm,mistral]>=1.11.3",
    "ipykernel>=6.30.1",
    "jupyter>=1.1.1",
    "litellm>=1.77.1",
    "matplotlib>=3.10.6",
    "mistralai>=1.9.10",
    "mlflow>=3.3.2",
    "nltk>=3.9.1",
    "numpy>=1.26.4",
    "ollama>=0.6.0",
    "omegaconf>=2.3.0",
    "openai>=1.102.0",
    "pydantic>=2.11.7",
    "pytest>=8.4.2",
    "python-dotenv>=1.1.1",
    "scikit-learn>=1.7.1",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.1.0",
    "tomotopy>=0.13.0",
    "wordcloud>=1.9.4",
    "xgboost>=3.0.4",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
]
